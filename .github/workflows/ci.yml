name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: task workspace:sync
      - run: task lint:go
      - run: task test:go
      # 外部消费验证此前不在 CI 网内：它最能发现"Core 公共 API 变更后
      # 外部宿主还能否编译并跑通"这类破坏性改动，而这类问题只能靠人工想起来跑。
      - run: task test:core:external
      - run: task build:go

  race:
    name: Core 竞态检测 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: task workspace:sync
      # 竞态检测是并发代码的唯一自动化防线，此前只在本地临时执行过。
      # 单独成 job 而非并入 go 矩阵：-race 使测试耗时翻倍以上，
      # 而竞态是代码性质而非平台性质，跑一个平台即可覆盖。
      - run: task test:core:race

  static-analysis:
    name: Go 静态分析与漏洞扫描 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 显式写到补丁版：govulncheck 按当前工具链判定标准库漏洞，
          # 补丁版本落后会让门禁报出与代码无关的告警。
          go-version: 1.25.13
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
            apps/jrpc/go.sum
            core/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: task workspace:sync
      # 工具的二进制装到 $(go env GOPATH)/bin，该目录在 runner 的默认 PATH 内。
      - run: task tools:install
      # goimports、golangci-lint 与 govulncheck 此前只在本机手工跑过。
      # 单独成 job：这三项都要先安装工具，并入三平台矩阵会让每个平台重复安装。
      - run: task lint:enhanced

  fuzz:
    name: wire 模糊测试 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: task workspace:sync
      - run: task test:fuzz

  compat-interop:
    name: 官方客户端互操作 / Linux
    runs-on: ubuntu-latest
    # 官方客户端互操作此前只在本机 Windows 上跑过，Linux 运行时无人验证——而它正是
    # 跨平台验收缺的那一半。本 job 在 Linux runner 上用官方 frpc 的 Linux 发行包
    # （摘要已登记在 scripts/compat/frpc.mjs，与官方 frp_sha256_checksums.txt 一致）
    # 复跑互操作矩阵，把"能在 Linux 上跑通"变成持续门禁而不是一次性结论。
    # 不含 kcp：官方 frpc v0.70.0 在 protocol=kcp 下不发出数据报，已登记为基线客户端
    # 限制，纳入只会让 job 空等超时。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: task workspace:sync
      # 黑盒宿主需要已构建的 jrps 回退产物（bin/jrps，Linux 下无扩展名）。
      - run: task build:go
      - run: node scripts/compat/run-matrix.mjs --transport=tcp,websocket,wss,quic --wire=both --case=login,proxy-tcp

  web-production:
    name: Web 与生产构建 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.work.sum
            apps/jrps/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: arduino/setup-task@v3
        with:
          version: 3.52.0
      - run: pnpm install --frozen-lockfile
      - run: task workspace:sync
      - run: task fmt:check
      - run: task lint
      - run: task typecheck
      - run: task test
      - run: task build
